# SPDX-License-Identifier: GPL-3.0-only
# Test FiMba-1 and publish the browser version to GitHub Pages.
#
#   pull request   the full test suite, then the browser version built (downloadable from the run as
#                  "FiMba-1-web": a single FiMba-1.html that opens from disk)
#   push to main   the same, then published to https://jadamsowers.github.io/fm1-fimba/
#
# It runs in the official Emscripten container, the version the web app is built and tested with
# locally. (The firmware package itself, build/fimba.fwsc, needs JieLi's toolchain: see BUILDING.md.)
name: Test and publish the web app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.10
    steps:
      - uses: actions/checkout@v7

      - name: Python packages (Pillow renders the screen's fonts)
        run: python3 -m pip install --quiet --break-system-packages Pillow

      - name: Tests (engine, platform, the whole app in the simulator, the WebAssembly build)
        run: sh tests/run_tests.sh

      - name: Build the web app
        run: |
          sh web/emu/build.sh
          mkdir -p site
          cp build/emu/FiMba-1.html site/index.html
          touch site/.nojekyll

      - name: Keep the web app with the run (to try a pull request before merging)
        uses: actions/upload-artifact@v7
        with:
          name: FiMba-1-web
          path: build/emu/FiMba-1.html

      - name: Keep the scenario screenshots and audio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: build/scenarios/
          if-no-files-found: ignore

      - name: Package the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
