# SPDX-License-Identifier: GPL-3.0-only
# Test FiMba-1, build the firmware and the browser version, publish them.
#
#   pull request      the full test suite; the firmware package built and checked; both kept with the
#                     run as downloads ("fimba-firmware", "FiMba-1-web")
#   push to main      the same, then the browser version published to
#                     https://jadamsowers.github.io/fm1-fimba/, with the latest release's firmware
#                     beside it for the page's installer (firmware/latest.json)
#   tag vX.Y[.Z]      the same, with a release build (identity FM-1_8XXYYZZ, version on the splash),
#                     published as a GitHub Release with the .fwsc and the one-file web app, and the
#                     site republished with that firmware in its installer
name: Test, build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests and the web app
    runs-on: ubuntu-latest
    # the Emscripten version the web app is built and tested with locally
    container: emscripten/emsdk:6.0.10
    steps:
      - uses: actions/checkout@v7

      - name: Python packages (Pillow renders the screen's fonts)
        run: python3 -m pip install --quiet --break-system-packages Pillow

      - name: Tests (engine, platform, the whole app in the simulator, the WebAssembly build)
        run: sh tests/run_tests.sh

      - name: Build the web app
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export OM_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          sh web/emu/build.sh
          mkdir -p site
          cp build/emu/FiMba-1.html site/index.html
          touch site/.nojekyll

      - name: Keep the web app with the run
        uses: actions/upload-artifact@v7
        with:
          name: FiMba-1-web
          path: build/emu/FiMba-1.html

      - name: Keep the scenario screenshots and audio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: build/scenarios/
          if-no-files-found: ignore

      - name: Keep the site for the Pages job
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          include-hidden-files: true

  firmware:
    name: Firmware package
    runs-on: ubuntu-latest
    env:
      AC79_SDK: ${{ github.workspace }}/../sdk
      JIELI_TOOLCHAIN: ${{ github.workspace }}/../jieli/toolchain
      JIELI_DOCKER: '1'          # the toolchain runs in a Debian container, as on a Mac
      # the FoMni commit the package is compared with (its update loader and boot head must match)
      FOMNI_REF: 378dfacbf476c8d7c181eed83c58c019667133d6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install --quiet -r requirements.txt

      - name: JieLi toolchain (JieLi's server, else the same package from a Docker image)
        run: sh tools/get_toolchain.sh "$(dirname "$JIELI_TOOLCHAIN")"

      - name: AC79 SDK files (three, SHA-256 checked)
        run: sh tools/get_sdk.sh "$AC79_SDK"

      - name: Build the firmware package
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) python3 tools/build.py --release "${GITHUB_REF_NAME#v}" ;;
            *)            python3 tools/build.py ;;
          esac
          ls -l build/*.fwsc

      - name: Build FoMni's package, to compare with
        run: |
          git clone --quiet https://github.com/charlesvestal/fm1-fomni build/fomni-ref
          git -C build/fomni-ref checkout --quiet "$FOMNI_REF"
          cp tools/gen_font.py build/fomni-ref/tools/      # (the font only changes the app; works without raqm)
          (cd build/fomni-ref && python3 tools/build.py)

      - name: Check the package (every CRC; all but the app byte-identical to FoMni's)
        run: |
          pkg=$(ls build/fimba*.fwsc | head -1)
          python3 tools/check_fwsc.py "$pkg" --app build/fimba.bin --ref build/fomni-ref/build/omni.fwsc

      - name: Update-path and install tests against the package
        run: |
          [ -f build/fimba.fwsc ] || cp build/fimba-*.fwsc build/fimba.fwsc   # (the tests look for this name)
          sh tests/run_tests.sh

      - name: Keep the package with the run
        uses: actions/upload-artifact@v7
        with:
          name: fimba-firmware
          path: |
            build/fimba*.fwsc
            build/fimba.bin

  pages:
    name: Publish the web app (and its installer's firmware) to GitHub Pages
    # main: the latest release's firmware goes beside the page. A tag: that release's, once it's out.
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.web.result == 'success' && needs.release.result != 'failure'
    needs: [web, release]
    runs-on: ubuntu-latest
    # one publish at a time, whole: a main push and a tag pushed together once raced, the main run
    # choosing its firmware before the tag's release existed and publishing after it.
    # Pages keeps the first deployment of a commit and quietly ignores later ones (deploy-pages names
    # a deployment by its commit), so a commit both on main and tagged is published by the tag's run
    # alone: tag a release soon after merging it, before main's run gets here
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: A tagged commit on main is left to its tag's run
        id: tagged
        if: github.ref == 'refs/heads/main'
        run: |
          # a lightweight tag lists the commit, an annotated one its peeled "^{}" line
          if git ls-remote --tags origin 'v*' | grep -q "^$GITHUB_SHA"; then
            echo "$GITHUB_SHA is tagged: its tag's run publishes it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.tagged.outputs.skip != 'true'
        with:
          name: site
          path: site

      - name: The latest release's firmware, for the installer
        if: steps.tagged.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the highest version among the published releases (not the newest-dated: a release is dated
          # by its commit, so v0.2.0 tagged on v0.1.0's commit sorts as older)
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
                  --jq '.[] | select(.isDraft | not) | .tagName' | grep -E '^v[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ -z "$tag" ]; then echo "no release yet: the installer offers a file chooser only"; exit 0; fi
          mkdir -p site/firmware
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'fimba-*.fwsc' --dir site/firmware
          file=$(cd site/firmware && ls fimba-*.fwsc | head -1)
          python3 - "$tag" "$file" <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          from fm1_install import product_of
          tag, f = sys.argv[1], sys.argv[2]
          raw = open("site/firmware/" + f, "rb").read()
          meta = {"version": tag.lstrip("v"), "product": product_of(raw), "file": f}
          open("site/firmware/latest.json", "w").write(json.dumps(meta))
          print("installer:", meta)
          PY

      - uses: actions/upload-pages-artifact@v5
        if: steps.tagged.outputs.skip != 'true'
        with:
          path: site

      - name: Deploy
        id: deployment
        if: steps.tagged.outputs.skip != 'true'
        uses: actions/deploy-pages@v5

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$ver/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "FiMba-1 $ver (beta)" --notes-file notes.md --prerelease \
            dist/fimba-firmware/fimba-"$ver".fwsc dist/FiMba-1-web/FiMba-1.html
